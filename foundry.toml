[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = []

[fuzz]
runs = 256
max_test_rejects = 65536

# The invariant handler wraps every escrow call it expects to revert in try/catch, so any revert that
# reaches the runner (including a failed assertion inside the handler) is a real failure.
[invariant]
runs = 64
depth = 48
fail_on_revert = true
call_override = false

[lint]
# Expiry logic necessarily compares block.timestamp; the one-block drift a builder can add is
# irrelevant at the hour-scale windows this contract uses (documented in README "Trust assumptions").
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
